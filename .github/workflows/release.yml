name: Test and release skill
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: |
          python -m pip install reportlab pypdf
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-uming
      - name: Verify release version
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip --prefix=ios-aside-review/ --output="$RUNNER_TEMP/ios-aside-review.zip" HEAD
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/ios-aside-review.zip" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest

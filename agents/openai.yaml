interface:
  display_name: "iOS A面审核检查"
  short_description: "只读检查 iOS A 面内购、隐私清单、权限与上架风险"
  default_prompt: "使用 $ios-aside-review 对这个 iOS A 面项目执行只读审核，默认将传入的正常工程根目录作为 A 面源码统计范围，缺省或空 a_side_source_paths 无需额外确认；有效源码必须严格超过 5000 行，保留默认排除规则。先运行 scripts/update_skill.py --check 检查 GitHub 最新正式版本；更新后重读 SKILL.md 再执行，检查失败则停止。仅检查工程存在 WKWebView 初始化或明确类型及对应加载调用；不识别按钮、标题、协议入口或导航，不要求代理、URL、挂载或调用可达性，不请求协议 URL。通过仅证明工程使用 WKWebView 加载，不证明两类协议已接入；注释、字符串和其它类型的同名方法不作为证据。默认只生成包含全部检查项和四态结论的 A4 PDF 报告；Push 只检查权限配置，ATT 只检查权限配置与用途文案。生成前使用已安装的 PDF 技能，缺少时先安装。"
policy:
  allow_implicit_invocation: true
